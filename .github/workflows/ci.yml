name: CoralGuard CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Configuration & System Audit
        run: |
          python -m src.cli info

      - name: Run Automated Test Suite (22 Tests)
        run: |
          python -m unittest discover tests

      - name: Test Automated Early Warning Monitoring Scan
        run: |
          python -m src.cli monitor --single-shot

      - name: Test Programmatic REST API
        run: |
          python -m unittest tests/test_server.py

      - name: Test HTML Executive Report Export
        run: |
          python -m src.cli export --output reports/ci_executive_report.html

